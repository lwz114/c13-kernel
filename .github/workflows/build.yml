name: build-c13-kernel

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Fetch msm8996-mainline kernel (v6.19.5-msm8996)
        run: |
          git clone --depth 1 --branch v6.19.5-msm8996 \
            https://gitlab.com/msm8996-mainline/linux.git linux

      - name: Apply Readboy C13 patches
        run: |
          cd linux
          git apply --verbose ../patches/c13-port.patch

      - name: Configure (pmOS config + C13 additions)
        run: |
          cd linux
          cp ../config/config-postmarketos-qcom-msm8996.aarch64 .config
          # Built-in USB gadget (ECM network + serial) so the initramfs
          # can bring up a USB SSH/serial console without modules
          cat >> .config << 'C13CFG'
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_F_ECM=y
          CONFIG_USB_F_SERIAL=y
          CONFIG_USB_F_ACM=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_GADGETFS=y
          C13CFG
          make ARCH=arm64 olddefconfig
          grep -E "CONFIG_(ARCH_QCOM|FB_SIMPLE|FRAMEBUFFER_CONSOLE|USB_CONFIGFS=|USB_F_ECM=)" .config | head

      - name: Build kernel
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs modules
          mkdir -p ../modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=../modules modules_install
          # Keep only display/panel modules + their deps (trim ~177MB -> ~25MB)
          cd ../modules/lib/modules/*/
          find kernel -name '*.ko*' | grep -vE 'kernel/drivers/(gpu/drm|video/backlight|soc/qcom|media/cec)' | xargs rm -f 2>/dev/null || true
          find kernel -type d -empty -delete 2>/dev/null || true
          cd - >/dev/null
          tar cf ../modules.tar -C ../modules lib

      - name: Build Linux initramfs (display modules + switch_root)
        run: |
          # modules_install output is at ../modules (lib/modules/<release>)
          bash ../make-initramfs.sh ../modules ../initramfs-linux.gz

      - name: Package boot.img (Linux initramfs, not stock Android ramdisk)
        run: |
          cd linux
          # kernel + appended C13 DTB, stock header layout
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8996-readboy-c13.dtb \
              > Image.gz-dtb
          python3 ../make-bootimg.py Image.gz-dtb ../initramfs-linux.gz boot-c13-linux.img \
            "console=ttyMSM1,115200,n8 console=tty0 androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 cma=32M loglevel=4 clk_ignore_unused panic=30"
          # sanity: boot partition on C13 is 64MB
          ls -l boot-c13-linux.img
          test "$(stat -c%s boot-c13-linux.img)" -lt $((64*1024*1024)) || \
            { echo "FATAL: boot.img exceeds 64MB boot partition"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c13-boot
          path: |
            linux/boot-c13-linux.img
            linux/initramfs-linux.gz
            modules.tar
            linux/arch/arm64/boot/Image.gz
            linux/arch/arm64/boot/dts/qcom/msm8996-readboy-c13.dtb
