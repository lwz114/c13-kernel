name: build-c13-kernel

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu android-tools-mkbootimg

      - name: Fetch msm8996-mainline kernel (v6.19.5-msm8996)
        run: |
          git clone --depth 1 --branch v6.19.5-msm8996 \
            https://gitlab.com/msm8996-mainline/linux.git linux

      - name: Apply Readboy C13 patches
        run: |
          cd linux
          git apply --verbose ../patches/c13-port.patch

      - name: Configure (pmOS config)
        run: |
          cd linux
          cp ../config/config-postmarketos-qcom-msm8996.aarch64 .config
          make ARCH=arm64 olddefconfig
          grep -E "CONFIG_(ARCH_QCOM|FB_SIMPLE|FRAMEBUFFER_CONSOLE)" .config | head

      - name: Build kernel
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs

      - name: Package boot.img
        run: |
          cd linux
          # kernel + appended C13 DTB, stock header layout
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8996-readboy-c13.dtb \
              > Image.gz-dtb
          mkbootimg \
            --kernel Image.gz-dtb \
            --ramdisk ../config/ramdisk.gz \
            --base 0x80000000 \
            --kernel_offset 0x8000 \
            --ramdisk_offset 0x1000000 \
            --second_offset 0xf00000 \
            --tags_offset 0x100 \
            --pagesize 4096 \
            --header_version 0 \
            --cmdline "console=ttyMSM1,115200,n8 console=tty0 androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 cma=32M loglevel=8" \
            -o boot-c13.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c13-boot
          path: |
            linux/boot-c13.img
            linux/arch/arm64/boot/Image.gz
            linux/arch/arm64/boot/dts/qcom/msm8996-readboy-c13.dtb
