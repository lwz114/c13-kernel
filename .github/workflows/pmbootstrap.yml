name: pmbootstrap-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler cpio
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -sf "$(pwd)/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap

      - name: Setup pmaports
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          # 覆盖自定义设备与内核
          cp -r device/device-readboy-c13 pmaports/device/testing/ 2>/dev/null || true
          cp -r device/linux-c13 pmaports/device/testing/ 2>/dev/null || true
          cp device/linux-c13/config-c13.aarch64 pmaports/device/testing/linux-c13/ 2>/dev/null || true
          cp device/linux-c13/c13-port.patch pmaports/device/testing/linux-c13/ 2>/dev/null || true

      - name: pmbootstrap init
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          
          # 先生成合法的默认配置，再强制覆盖目标参数
          yes "" | pmbootstrap -p $(pwd)/pmaports init
          pmbootstrap -p $(pwd)/pmaports config device readboy-c13
          pmbootstrap -p $(pwd)/pmaports config ui phosh
          yes "" | pmbootstrap -p $(pwd)/pmaports init

      - name: Build kernel package
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          pmbootstrap -p $(pwd)/pmaports build linux-c13 --arch=aarch64

      - name: Build rootfs image
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          pmbootstrap -p $(pwd)/pmaports install --tar

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          sudo cp /tmp/pmos/images/readboy-c13/*.tar.xz output/ 2>/dev/null || \
          sudo cp /tmp/pmos/chroot_rootfs_readboy-c13/tmp/rootfs.tar.xz output/ 2>/dev/null || true
          sudo chown -R $USER:$USER output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-c13-image
          path: output/
