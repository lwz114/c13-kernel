name: pmbootstrap-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -sf "$(pwd)/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap

      - name: Setup pmaports & Rewrite APKBUILD
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          # 拷贝设备配置（跳过原有残缺的 APKBUILD）
          cp -r device/device-readboy-c13 pmaports/device/testing/ 2>/dev/null || true
          mkdir -p pmaports/device/testing/linux-c13
          cp device/linux-c13/config-c13.aarch64 pmaports/device/testing/linux-c13/ 2>/dev/null || true
          cp device/linux-c13/c13-port.patch pmaports/device/testing/linux-c13/ 2>/dev/null || true

          # 【终极大招】原地生成一个完美契合 Alpine/pmOS 规范的纯净 APKBUILD！
          # 砍掉所有 Ubuntu 特供写法、错误的跳转、以及重复打补丁逻辑
          cat << 'EOF' > pmaports/device/testing/linux-c13/APKBUILD
          # Maintainer: Readboy C13 port
          pkgname=linux-c13
          pkgver=6.19.5
          pkgrel=0
          pkgdesc="MSM8996 mainline kernel with Readboy C13 support"
          arch="aarch64"
          url="https://gitlab.com/msm8996-mainline/linux"
          license="GPL-2.0-only"
          options="!strip !check !tracedeps"
          makedepends="bc bison flex openssl-dev perl python3 elfutils-dev ncurses-dev"
          _kernelsrc="https://gitlab.com/msm8996-mainline/linux/-/archive/v6.19.5-msm8996/linux-v6.19.5-msm8996.tar.gz"
          
          # 正确触发下载，自动引入补丁和配置
          source="linux.tar.gz::$_kernelsrc
                  config-c13.aarch64
                  c13-port.patch"
          
          # 对应 GitLab 默认解压的根文件夹名，精准跳转，无需 mv
          builddir="$srcdir/linux-v6.19.5-msm8996"

          prepare() {
              # 自动应用 c13-port.patch
              default_prepare
              cp "$srcdir/config-c13.aarch64" .config
              make ARCH=arm64 olddefconfig
          }

          build() {
              unset LDFLAGS
              # 移除写死的交叉编译器，让 Alpine crossdirect 全权接管
              make ARCH=arm64 -j$(nproc) Image.gz dtbs modules
          }

          package() {
              install -Dm644 arch/arm64/boot/Image.gz "$pkgdir/boot/vmlinuz"
              install -Dm644 arch/arm64/boot/dts/qcom/msm8996-readboy-c13.dtb "$pkgdir/boot/msm8996-readboy-c13.dtb"
              make ARCH=arm64 INSTALL_MOD_PATH="$pkgdir" modules_install
          }
          EOF

      - name: pmbootstrap init
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          yes "" | pmbootstrap -p $(pwd)/pmaports init
          pmbootstrap -p $(pwd)/pmaports config device readboy-c13
          pmbootstrap -p $(pwd)/pmaports config ui phosh
          yes "" | pmbootstrap -p $(pwd)/pmaports init

      - name: Build kernel package
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          
          echo "==================== [执行] 重新计算校验和 ===================="
          pmbootstrap -p $(pwd)/pmaports checksum linux-c13 || exit 1
          
          echo "==================== [执行] 开始编译内核 ===================="
          pmbootstrap -p $(pwd)/pmaports build linux-c13 --arch=aarch64

      - name: Print detailed log on build failure
        if: failure()
        run: |
          echo "==================== [崩溃日志] 提取内核底层报错 ===================="
          # 放弃抓取毫无意义的命令日志，直接输出官方原生报错工具内容
          pmbootstrap log | tail -n 200 || true
          echo "=================================================================="

      - name: Build rootfs image
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          pmbootstrap -p $(pwd)/pmaports install --tar

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          sudo cp /tmp/pmos/images/readboy-c13/*.tar.xz output/ 2>/dev/null || \
          sudo cp /tmp/pmos/chroot_rootfs_readboy-c13/tmp/rootfs.tar.xz output/ 2>/dev/null || true
          sudo chown -R $USER:$USER output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-c13-image
          path: output/
