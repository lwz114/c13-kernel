name: pmbootstrap-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler cpio
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -sf "$(pwd)/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap

      - name: Setup pmaports
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          # 覆盖自定义设备与内核
          cp -r device/device-readboy-c13 pmaports/device/testing/
          cp -r device/linux-c13 pmaports/device/testing/
          cp device/linux-c13/config-c13.aarch64 pmaports/device/testing/linux-c13/
          cp device/linux-c13/c13-port.patch pmaports/device/testing/linux-c13/

      - name: pmbootstrap init
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          # -p 必须放在主命令后，移除废弃的 --nonfree 和 --mirror-alpine
          pmbootstrap -p ./pmaports -y init \
            --aports-channel edge \
            --arch aarch64 \
            --device readboy-c13 \
            --ui phosh

      - name: Build kernel package
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          pmbootstrap -p ./pmaports -y build linux-c13 --arch=aarch64

      - name: Build rootfs image
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          # 生成 tar 压缩包根文件系统，极简且不易死锁
          pmbootstrap -p ./pmaports -y install --tar --non-interactive

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          sudo cp /tmp/pmos/images/readboy-c13/*.tar.xz output/ 2>/dev/null || \
          sudo cp /tmp/pmos/chroot_rootfs_readboy-c13/tmp/rootfs.tar.xz output/ 2>/dev/null || \
          sudo cp /tmp/pmos/chroot_rootfs_readboy-c13/var/tmp/*.img output/ 2>/dev/null || true
          sudo chown -R $USER:$USER output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-c13-image
          path: output/
