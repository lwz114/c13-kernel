name: pmbootstrap-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -sf "$(pwd)/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap

      - name: Setup pmaports
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          # 覆盖自定义设备与内核
          cp -r device/device-readboy-c13 pmaports/device/testing/ 2>/dev/null || true
          cp -r device/linux-c13 pmaports/device/testing/ 2>/dev/null || true
          cp device/linux-c13/config-c13.aarch64 pmaports/device/testing/linux-c13/ 2>/dev/null || true
          cp device/linux-c13/c13-port.patch pmaports/device/testing/linux-c13/ 2>/dev/null || true
          
          # 自动清理 APKBUILD 里属于 Ubuntu 的依赖包名，适配 Alpine 环境
          sed -i 's/gcc-aarch64-linux-gnu//g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/build-essential//g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/device-tree-compiler/dtc/g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/libelf-dev/elfutils-dev/g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/libssl-dev/openssl-dev/g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/libncurses-dev/ncurses-dev/g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true
          sed -i 's/libncurses5-dev/ncurses-dev/g' pmaports/device/testing/linux-c13/APKBUILD 2>/dev/null || true

      - name: pmbootstrap init
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          
          yes "" | pmbootstrap -p $(pwd)/pmaports init
          pmbootstrap -p $(pwd)/pmaports config device readboy-c13
          pmbootstrap -p $(pwd)/pmaports config ui phosh
          yes "" | pmbootstrap -p $(pwd)/pmaports init

      - name: Build kernel package
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          
          echo "==================== [调试] 检查打包目录文件 ===================="
          ls -la $(pwd)/pmaports/device/testing/linux-c13/ || true
          
          echo "==================== [调试] 查看 APKBUILD 源码 ===================="
          cat $(pwd)/pmaports/device/testing/linux-c13/APKBUILD || true
          
          echo "==================== [执行] 重新计算校验和 ===================="
          # 如果 checksum 失败，立刻打印底层的 abuild 报错并退出！
          pmbootstrap -p $(pwd)/pmaports checksum linux-c13 || { 
            echo "==================== [崩溃日志] 校验和失败原因 ====================";
            cat ~/.local/var/pmbootstrap/log.txt | tail -n 100;
            exit 1; 
          }
          
          echo "==================== [执行] 开始编译内核 ===================="
          pmbootstrap -p $(pwd)/pmaports build linux-c13 --arch=aarch64

      - name: Build rootfs image
        run: |
          export PMBOOTSTRAP_WORKDIR=/tmp/pmos
          pmbootstrap -p $(pwd)/pmaports install --tar

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          sudo cp /tmp/pmos/images/readboy-c13/*.tar.xz output/ 2>/dev/null || \
          sudo cp /tmp/pmos/chroot_rootfs_readboy-c13/tmp/rootfs.tar.xz output/ 2>/dev/null || true
          sudo chown -R $USER:$USER output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-c13-image
          path: output/
